<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архитектура CopyModels</title>
<style>
:root { 
  --gap: 12px; 
  --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --border-radius-md: 6px;
  --color-border-primary: #333;
  --color-border-secondary: #ddd;
  --color-border-tertiary: #aaa;
  --color-background-secondary: #f5f5f5;
  --color-text-primary: #111;
  --color-text-secondary: #555;
  --color-text-tertiary: #888;
  --t: #555; /* Цвет линий и стрелок */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); padding: 20px; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
h2:not(.sr-only) { margin-bottom: 20px; }

.tabs { display: flex; gap: 8px; margin: 0 0 20px; }
.tab { padding: 6px 16px; border-radius: var(--border-radius-md); border: 1px solid var(--color-border-secondary); background: #fff; cursor: pointer; font-size: 13px; color: var(--color-text-secondary); font-family: var(--font-sans); transition: all .15s; }
.tab:hover { background: #f9f9f9; }
.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); font-weight: 500; border-color: var(--color-border-primary); }

.panel { display: none; }
.panel.active { display: block; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 16px; font-size: 12px; color: var(--color-text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Добавленные стили для SVG */
.th { font-weight: 600; font-size: 13px; fill: var(--color-text-primary); font-family: var(--font-sans); }
.ts { font-size: 11.5px; fill: var(--color-text-secondary); font-family: var(--font-sans); }

.node { cursor: pointer; }
.node rect { fill: #ffffff; transition: fill 0.2s; }
.node:hover rect { fill: #f0f8ff; } /* Подсветка при наведении */

/* Цвета блоков */
.c-gray rect { stroke: #888888; }
.c-red rect { stroke: #E24B4A; }
.c-purple rect { stroke: #7F77DD; }
.c-teal rect { stroke: #1D9E75; }
.c-amber rect { stroke: #BA7517; }
.c-blue rect { stroke: #3B8BD4; }

/* Базовые линии в SVG */
svg { max-width: 800px; display: block; }
</style>
</head>

function sendPrompt(message) {

function show(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  event.target.classList.add('active');
}
</script>
